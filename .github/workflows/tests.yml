name: tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  # يستدعيها ورك‌فلو النشر قبل أن يمسّ الإنتاج. ولأنّها تعمل من هناك على
  # كل دفعٍ إلى main، أُسقط main من المُشغِّل أعلاه كي لا تعمل مرتين.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Create SQLite Database
        run: touch database/database.sqlite

      # قبل بناء الواجهة: إضافة wayfinder في vite تستدعي artisan
      # أثناء البناء، والـ artisan لا يقوم بغير vendor/autoload.php ومفتاح التطبيق.
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest
